          <path d="M60 104 C 120 104, 140 60, 200 58 S 300 98, 360 82 S 440 40, 470 34" fill="none" style="stroke:var(--amber)" stroke-width="5" stroke-dasharray="10 9" stroke-linecap="round"/>
          <circle cx="60" cy="104" r="9" class="ill-teal"/><circle cx="200" cy="58" r="9" class="ill-teal"/><circle cx="360" cy="82" r="9" class="ill-teal"/>
          <path d="M470 6 c-10 0 -17 7 -17 17 c0 13 17 30 17 30 s17 -17 17 -30 c0 -10 -7 -17 -17 -17z" class="ill-amber"/><circle cx="470" cy="23" r="6" class="ill-ink"/>

          <rect x="100" y="64" width="118" height="34" rx="12" fill="#D6F0C6" stroke="#13233A" stroke-width="2"/><text x="116" y="86" font-family="DM Sans, Arial, sans-serif" font-size="13" font-weight="700" fill="#13233A">Vou ✓</text>
          <circle cx="196" cy="34" r="16" class="ill-teal"/><path d="M188 34 l6 6 10 -11" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
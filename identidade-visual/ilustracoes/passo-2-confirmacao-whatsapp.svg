<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 140" aria-hidden="true"><style>:root,svg{--bg:#F4F2ED;--surface:#FDFCF9;--surface-2:#EAE6DE;--hair:#D6D0C4;--ink:#13233A;--muted:#4B5667;--navy:#13233A;--navy-2:#1C3150;--on-navy:#F3F1EC;--on-navy-muted:#B9C4D2;--amber:#F2A62F;--amber-soft:#FBE3B8;--amber-ink:#8E5209;--teal:#1D6B74;--teal-soft:#CFE7E6;--chat:#E3EFEA;--chat-me:#D6F0C6;--chat-ink:#13233A;--road:#C9C2B4;--f-display:'Bricolage Grotesque','DM Sans',Arial,sans-serif;--f-body:'DM Sans',Arial,sans-serif;--f-mono:'IBM Plex Mono','Courier New',monospace}
.dk-bubble{fill:#F3F1EC}
.dk-bubble-me{fill:#D6F0C6}
.dk-bubble-text{font-family:var(--f-body);font-size:13px;font-weight:600;fill:#13233A}
.dk-teal{fill:#6CC2C8}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
            <rect class="dk-bubble" x="22" y="18" width="190" height="40" rx="14"/><text class="dk-bubble-text" x="36" y="43">Amanhã tem aula 19h. Vai?</text>
            <rect class="dk-teal" x="22" y="66" width="90" height="26" rx="9"/><text x="67" y="84" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-weight="700" font-size="13" fill="#13233A">Vou</text>
            <rect x="120" y="66" width="92" height="26" rx="9" fill="none" stroke="#6CC2C8" stroke-width="2"/><text x="166" y="84" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-weight="700" font-size="13" fill="#6CC2C8">Não vou</text>
            <rect class="dk-bubble-me" x="150" y="100" width="108" height="30" rx="12"/><text class="dk-bubble-text" x="164" y="120">Vou!</text>
            <path d="M222 115 l5 5 9 -10" fill="none" stroke="#1D6B74" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>